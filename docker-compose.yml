name: routeoptimizer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routeoptimizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeoptimizer}
      POSTGRES_DB: ${POSTGRES_DB:-routeoptimizer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routeoptimizer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  optimizer:
    build: ./optimizer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-routeoptimizer}:${POSTGRES_PASSWORD:-routeoptimizer}@postgres:5432/${POSTGRES_DB:-routeoptimizer}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose:
      - "8090"

  backend:
    build: ./backend
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-routeoptimizer}:${POSTGRES_PASSWORD:-routeoptimizer}@postgres:5432/${POSTGRES_DB:-routeoptimizer}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-80}
      OSRM_MODE: ${OSRM_MODE:-hosted}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      OSRM_TABLE_CHUNK: ${OSRM_TABLE_CHUNK:-100}
      OSRM_ROUTE_WAYPOINTS: ${OSRM_ROUTE_WAYPOINTS:-90}
      OSRM_THROTTLE_MS: ${OSRM_THROTTLE_MS:-700}
      GEOCODER: ${GEOCODER:-nominatim}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      GEOCODE_DELAY_MS: ${GEOCODE_DELAY_MS:-1100}
      OPTIMIZER_URL: http://optimizer:8090
      MAX_STOPS_PER_JOB: ${MAX_STOPS_PER_JOB:-5000}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-100}
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

  # Optional self-hosted OSRM router.
  # Run `./infra/osrm/setup-osrm.sh` first to download + build the data into ./osrm-data.
  # Then start with:  docker compose --profile osrm up -d
  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 2000 --max-matching-size 100
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
