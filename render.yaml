# Render Blueprint — deploys the ENTIRE RouteOptimizer stack.
#
# BEFORE deploying:
#   1. Create a free Postgres at https://neon.tech -> copy the connection string.
#   2. Delete any existing Render services for this app (to avoid conflicts).
#   3. Render Dashboard -> New -> Blueprint -> connect
#      https://github.com/rajmpateltech/route-optimizer
#   4. When prompted, set DATABASE_URL for BOTH backend and optimizer
#      to your Neon connection string.
#   5. Set CORS_ORIGINS below to the actual frontend URL you're given.
#
# After deploy, you get 3 public URLs:
#   frontend:  https://routeoptimizer-frontend.onrender.com
#   backend:   https://routeoptimizer-backend.onrender.com
#   optimizer: https://routeoptimizer-optimizer.onrender.com

services:
  # --- Frontend (React SPA served as static site) ---
  - type: static_site
    name: routeoptimizer-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://routeoptimizer-backend.onrender.com

  # --- Backend (Node.js API) ---
  - type: web
    name: routeoptimizer-backend
    runtime: docker
    rootDir: backend
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPTIMIZER_URL
        value: https://routeoptimizer-optimizer.onrender.com
      - key: CORS_ORIGINS
        value: https://routeoptimizer-frontend.onrender.com
      - key: OSRM_MODE
        value: hosted
      - key: GEOCODER
        value: nominatim
      - key: OSRM_TABLE_CHUNK
        value: "100"
      - key: OSRM_THROTTLE_MS
        value: "700"
      - key: MAX_STOPS_PER_JOB
        value: "5000"

  # --- Optimizer (Python / OR-Tools) ---
  - type: web
    name: routeoptimizer-optimizer
    runtime: docker
    rootDir: optimizer
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
