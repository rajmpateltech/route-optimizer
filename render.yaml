# Render Blueprint — deploys backend + optimizer as two free web services.
#
# 1. Create a free Postgres at https://neon.tech  ->  copy the connection string.
# 2. Render Dashboard -> New -> Blueprint -> point at this repo.
# 3. When prompted, set DATABASE_URL (backend + optimizer) to your Neon string.
#    Leave REDIS_URL empty unless you want cross-instance rate limiting (Upstash free).
# 4. Host the frontend on Netlify with env var:
#       VITE_API_BASE = https://routeoptimizer-backend.onrender.com
#    and set CORS_ORIGINS below to your Netlify URL (https://<app>.netlify.app).
#    IMPORTANT: replace the placeholder below with your actual Netlify URL
#    before/after deploying, otherwise browser requests from Netlify will be blocked.
services:
  - type: web
    name: routeoptimizer-optimizer
    runtime: docker
    rootDir: optimizer
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: routeoptimizer-backend
    runtime: docker
    rootDir: backend
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPTIMIZER_URL
        value: https://routeoptimizer-optimizer.onrender.com
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-NETLIFY-URL.netlify.app
      - key: OSRM_MODE
        value: hosted
      - key: GEOCODER
        value: nominatim
